<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .shell { position: relative; height: 31px; padding-top: 0; }
    .shell.expanded { height: 276px; padding-top: 245px; }
    input { display: block; width: 100%; height: 31px; padding: 4px 34px 4px 11px; border: 1px solid #cbd5e1; border-radius: 7px; outline: 0; color: #172033; background: white; font: 14px/1.4 inherit; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
    input::-webkit-search-cancel-button { cursor: pointer; }
    .results { position: absolute; left: 0; right: 0; bottom: 38px; max-height: 231px; overflow-y: auto; padding: 5px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; box-shadow: 0 12px 34px rgba(15,23,42,.22); }
    button { display: block; width: 100%; overflow: hidden; padding: 7px 9px; border: 0; border-radius: 6px; color: #172033; background: white; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    button:hover, button.selected { background: #eaf1ff; }
    .message { padding: 7px 9px; color: #64748b; font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="results" role="listbox" hidden></div>
    <input type="search" aria-label="检索文件名" role="combobox" aria-autocomplete="list" aria-expanded="false" placeholder="检索文件名" autocomplete="off">
  </div>
  <script>
    const input = document.querySelector('input');
    const resultsBox = document.querySelector('.results');
    let serverQuery = '';
    let serverResults = [];
    let selected = -1;
    let composing = false;
    let timer = 0;
    let lastSentQuery = null;
    let requestId = 0;

    const post = message => parent.postMessage({isStreamlitMessage: true, ...message}, '*');
    const setValue = value => post({type: 'streamlit:setComponentValue', value, dataType: 'json'});
    const operation = (type, extra = {}) => setValue({type, op_id: `${Date.now()}-${++requestId}`, ...extra});
    const setHeight = height => post({type: 'streamlit:setFrameHeight', height});

    function positionHost() {
      document.querySelector('.shell').classList.toggle('expanded', !resultsBox.hidden);
      setHeight(resultsBox.hidden ? 31 : 276);
    }

    function hideResults() {
      resultsBox.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      positionHost();
    }

    function showResults() {
      const query = input.value.trim();
      resultsBox.replaceChildren();
      if (!query || document.activeElement !== input || composing) return hideResults();
      if (query !== serverQuery) {
        const message = document.createElement('div');
        message.className = 'message'; message.textContent = '正在查找…'; resultsBox.append(message);
      } else if (!serverResults.length) {
        const message = document.createElement('div');
        message.className = 'message'; message.textContent = '没有匹配的文件'; resultsBox.append(message);
      } else {
        selected = Math.max(-1, Math.min(selected, serverResults.length - 1));
        serverResults.forEach((name, index) => {
          const button = document.createElement('button');
          button.type = 'button'; button.role = 'option'; button.textContent = name;
          button.className = index === selected ? 'selected' : '';
          button.setAttribute('aria-selected', index === selected ? 'true' : 'false');
          button.addEventListener('mousedown', event => event.preventDefault());
          button.addEventListener('click', () => navigate(name));
          resultsBox.append(button);
        });
      }
      resultsBox.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      positionHost();
    }

    function scheduleSearch(delay = 100) {
      clearTimeout(timer);
      const query = input.value;
      selected = -1;
      showResults();
      timer = setTimeout(() => {
        if (composing || query === lastSentQuery) return;
        lastSentQuery = query;
        operation('search', {query});
      }, delay);
    }

    function navigate(name = '') {
      const index = selected >= 0 ? selected : 0;
      const sample = name || serverResults[index] || '';
      if (!sample) return;
      hideResults();
      operation('search_navigate', {query: input.value, sample});
    }

    input.addEventListener('compositionstart', () => {
      composing = true; clearTimeout(timer); hideResults();
    });
    input.addEventListener('compositionend', () => {
      composing = false; scheduleSearch(0);
    });
    input.addEventListener('input', event => {
      if (!composing && !event.isComposing) scheduleSearch();
    });
    input.addEventListener('focus', showResults);
    input.addEventListener('blur', () => setTimeout(hideResults, 120));
    input.addEventListener('keydown', event => {
      if (composing || event.isComposing || event.keyCode === 229) return;
      if (event.key === 'ArrowDown' && serverResults.length) selected = Math.min(serverResults.length - 1, selected + 1);
      else if (event.key === 'ArrowUp' && serverResults.length) selected = Math.max(0, selected < 0 ? 0 : selected - 1);
      else if (event.key === 'Enter' && serverResults.length) { event.preventDefault(); navigate(); return; }
      else if (event.key === 'Escape') { hideResults(); return; }
      else return;
      event.preventDefault(); showResults();
    });

    addEventListener('message', event => {
      if (event.data?.type !== 'streamlit:render') return;
      const args = event.data.args || {};
      serverQuery = String(args.query || '');
      serverResults = Array.isArray(args.results) ? args.results.map(String) : [];
      if (!input.value && serverQuery) input.value = serverQuery;
      showResults();
      positionHost();
    });
    addEventListener('resize', positionHost);
    post({type: 'streamlit:componentReady', apiVersion: 1});
    setHeight(31);
    positionHost();
  </script>
</body>
</html>
