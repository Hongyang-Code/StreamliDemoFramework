<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .shell { position: relative; width: 100%; height: 100%; padding-bottom: 38px; }
    input { position: absolute; left: 0; bottom: 0; width: 100%; height: 31px; padding: 5px 30px 5px 9px;
      border: 1px solid #cbd5e1; border-radius: 8px; color: #172033; background: #fff; outline: none; font-size: 13px; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.16); }
    .results { position: absolute; left: 0; right: 0; bottom: 38px; max-height: 238px; overflow-y: auto;
      padding: 5px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff;
      box-shadow: 0 14px 36px rgba(15,23,42,.24); }
    .results[hidden] { display: none; }
    button { display: block; width: 100%; overflow: hidden; padding: 7px 9px; border: 0; border-radius: 7px;
      color: #172033; background: #fff; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    button:hover, button.selected { color: #fff; background: #2563eb; }
    .message { padding: 8px 9px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="results" role="listbox" hidden></div>
    <input type="search" placeholder="检索文件名" autocomplete="off" aria-label="检索文件名"
      role="combobox" aria-autocomplete="list">
  </div>
  <script>
    const input = document.querySelector('input');
    const results = document.querySelector('.results');
    let composing = false;
    let focused = false;
    let selected = -1;
    let timer = null;
    let backendQuery = '';
    let names = [];

    const send = message => parent.postMessage({__filenameSearch: true, ...message}, '*');
    const resize = open => {
      const contentHeight = open ? Math.min(276, 43 + Math.max(36, results.scrollHeight)) : 31;
      send({type: 'height', height: contentHeight});
    };
    const render = () => {
      results.replaceChildren();
      const query = input.value.trim();
      if (!focused || !query || composing) { results.hidden = true; resize(false); return; }
      if (input.value !== backendQuery) {
        const message = document.createElement('div'); message.className = 'message'; message.textContent = '正在查找…';
        results.appendChild(message);
      } else if (!names.length) {
        const message = document.createElement('div'); message.className = 'message'; message.textContent = '没有匹配的文件名';
        results.appendChild(message);
      } else {
        selected = Math.min(selected, names.length - 1);
        names.forEach((name, index) => {
          const option = document.createElement('button');
          option.type = 'button'; option.textContent = name; option.title = name;
          option.setAttribute('role', 'option'); option.setAttribute('aria-selected', index === selected ? 'true' : 'false');
          if (index === selected) option.classList.add('selected');
          option.onmousedown = event => event.preventDefault();
          option.onclick = () => navigate(name);
          results.appendChild(option);
        });
      }
      results.hidden = false;
      requestAnimationFrame(() => resize(true));
    };
    const requestSearch = delay => {
      clearTimeout(timer);
      const query = input.value;
      timer = setTimeout(() => { if (!composing && input.value === query) send({type: 'query', query}); }, delay);
    };
    const navigate = name => {
      const query = input.value.trim();
      if (!query) return;
      results.hidden = true; resize(false);
      send({type: 'navigate', query, sample: name || ''});
    };

    input.onfocus = () => { focused = true; render(); };
    input.onblur = () => setTimeout(() => {
      if (document.activeElement === input) return;
      focused = false; results.hidden = true; resize(false);
    }, 0);
    input.oncompositionstart = () => { composing = true; clearTimeout(timer); results.hidden = true; resize(false); };
    input.oncompositionend = () => { composing = false; selected = -1; render(); requestSearch(0); };
    input.oninput = event => {
      selected = -1;
      if (event.isComposing || composing) { clearTimeout(timer); return; }
      render(); requestSearch(80);
    };
    input.onkeydown = event => {
      if (event.isComposing || composing || event.keyCode === 229) return;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (names.length && input.value === backendQuery) {
          const direction = event.key === 'ArrowDown' ? 1 : -1;
          selected = selected < 0 ? (direction > 0 ? 0 : names.length - 1) : (selected + direction + names.length) % names.length;
          render();
        }
      } else if (event.key === 'Enter') {
        event.preventDefault();
        navigate(names[selected] || names[0] || '');
      } else if (event.key === 'Escape') {
        results.hidden = true; resize(false);
      }
    };
    addEventListener('message', event => {
      const message = event.data || {};
      if (!message.__filenameSearchHost) return;
      backendQuery = message.query || '';
      names = Array.isArray(message.results) ? message.results : [];
      render();
    });
    send({type: 'ready'});
  </script>
</body>
</html>
