<div class="sample-app">
  <div class="sample-grid" data-role="grid"></div>
  <div class="empty-state" data-role="empty" hidden>当前目录没有匹配此模态的文件。</div>
  <div class="toolbar" data-role="toolbar">
    <div class="toolbar-segment" data-role="toolbar-before"></div>
    <div class="toolbar-search">
      <input class="search-input" type="search" placeholder="检索文件名" autocomplete="off"
        aria-label="检索文件名" role="combobox" aria-autocomplete="list">
      <div class="search-suggestions" data-role="search-suggestions" role="listbox" hidden></div>
    </div>
    <div class="toolbar-segment" data-role="toolbar-after"></div>
  </div>
  <div class="context-menu" data-role="context" hidden>
    <button type="button" data-role="open-viewer">🔍 单独查看</button>
    <button type="button" data-role="open-note">📝 单个样本备注</button>
  </div>
  <dialog class="viewer-dialog" data-role="viewer-dialog">
    <div class="viewer-shell">
      <header>
        <strong data-role="viewer-filename"></strong>
        <button type="button" data-role="close-viewer" class="icon-button" aria-label="关闭">×</button>
      </header>
      <div class="viewer-canvas" data-role="viewer-canvas">
        <button type="button" data-role="viewer-previous" class="viewer-nav viewer-previous" aria-label="上一张图片">‹</button>
        <img data-role="viewer-image" alt="单独查看图片">
        <button type="button" data-role="viewer-next" class="viewer-nav viewer-next" aria-label="下一张图片">›</button>
      </div>
      <footer>
        <span class="viewer-position" data-role="viewer-position"></span>
        <button type="button" data-role="zoom-out" title="缩小" aria-label="缩小">−</button>
        <button type="button" data-role="zoom-reset">复位 · <span data-role="zoom-value">100%</span></button>
        <button type="button" data-role="zoom-in" title="放大" aria-label="放大">＋</button>
        <small>方向键切换 · 滚轮缩放 · 拖拽平移</small>
      </footer>
    </div>
  </dialog>
  <dialog class="note-dialog" data-role="note-dialog">
    <form method="dialog">
      <header>
        <div><strong>单个样本备注</strong><small data-role="note-filename"></small></div>
        <button value="cancel" class="icon-button" aria-label="关闭">×</button>
      </header>
      <textarea data-role="note-text" placeholder="输入这个样本的备注……"></textarea>
      <div class="note-meta" data-role="note-updated"></div>
      <details><summary>修订历史</summary><div data-role="note-history" class="history"></div></details>
      <footer>
        <button type="button" data-role="clear-note" class="danger">清空备注</button>
        <span></span>
        <button value="cancel">取消</button>
        <button type="button" data-role="save-note" class="primary">保存</button>
      </footer>
    </form>
  </dialog>
</div>
