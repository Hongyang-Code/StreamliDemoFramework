[server]
headless = true
enableWebsocketCompression = true
maxMessageSize = 160
# Demo servers do not need source-code hot reload. Disabling the watcher also
# avoids exhausting the host-wide Linux inotify quota on shared servers.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans-serif"
